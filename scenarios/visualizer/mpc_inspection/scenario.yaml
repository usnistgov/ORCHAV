# MPC Inspection - First Visualizer Workflow
# =========================================
# A small, static Munich frame for inspecting MPCs in 3D.
#
# Run with:
#   orchav-generator scenarios/visualizer/mpc_inspection/
#   orchav-visualizer --scenario scenarios/visualizer/mpc_inspection/

schema_version: 2

scene:
  source: sionna
  id: munich

raytracing:
  enabled: true
  export_path_metrics: true
  scene_materials:
    scattering_coefficient_preset: itu

timeline:
  steps: 1
  duration_s: 0.0

actors:
  tx:
    - name: RooftopCell
      mobility:
        type: stationary
        position_m: [80.0, 100.0, 30.0]
  rx:
    - name: StreetRx
      mobility:
        type: stationary
        position_m: [25.0, 80.0, 1.5]

generator_summary:
  enabled: true
  create: [scene2d]
  visualization:
    scene2d_mode: auto
