# Live Generator (gRPC) - Localhost Session
# =========================================
# Stream frames from a generator instance running on localhost.

schema_version: 2

scene:
  source: sionna
  id: etoile

debug_level: INFO

data:
  mode: live_grpc

raytracing:
  enabled: true
  export_path_metrics: true

timeline:
  steps: 50
  duration_s: 5.0

actors:
  tx:
    - name: BaseStation
      mobility:
        type: stationary
        position_m: [0.0, 0.0, 30.0]
      orientation:
        type: fixed
        pitch_deg: -45.0

  rx:
    - name: MobileRx
      mobility:
        type: linear
        start_m: [60.0, -40.0, 1.5]
        end_m: [-60.0, 40.0, 1.5]
      orientation:
        type: fixed
        yaw_deg: 180.0
