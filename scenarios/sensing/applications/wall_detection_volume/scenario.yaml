# One cube and a finite wall; generate.py prepares paired volume trials.
schema_version: 2
scene:
  source: local
  id: scene/wall.xml
data:
  files:
    chunk_size: 64
raytracing:
  enabled: true
  carrier_frequency_hz: 28.0e9
  antenna:
    rx:
      num_rows: 8
      num_cols: 8
  quality:
    preset: low
    custom:
      diffuse_reflection: true
      samples_per_src: 300000
      max_depth: 3
      seed: 20260923
  materials:
    itu_metal_Cube:
      scattering_coefficient: 0.99
      scattering_pattern: lambertian
timeline:
  steps: 64
  sample_rate_hz: 1000.0
actors:
  tx:
  - name: RadarTX
    mobility:
      type: stationary
      position_m: [-6, 0, 2]
  rx:
  - name: RadarRX
    mobility:
      type: stationary
      position_m: [-6, 0, 2]
  targets:
  - name: Cube
    asset:
      source: directory
      path: libraries/targets/cube
      pattern: cube.ply
      material_type: metal
      scale: 0.5
      switch_meshes: false
    mobility:
      type: linear
      start_m: [3, 0, 2]
      end_m: [3.063, 0, 2]
sensing:
  enabled: true
  preset: coherent_hann
  acquisition:
    bandwidth_hz: 500000000.0
    frequency_samples: 128
    sample_rate_hz: 1000.0
    samples_per_cpi: 64
  processing:
    range:
      interpretation: monostatic
      fft_size: 128
    clutter:
      history_enabled: true
      history_window: 16
  noise:
    target_relative:
      seed: 20260922
  detection:
    mode: beam_scan
    angle_oversampling: 4
    cfar:
      threshold_scale: 2.0
      range_doppler:
        reference_range_cells: 6
    exclusions:
      doppler_dc_bins: 2
    filters:
      minimum_snr_db: 10.0
      maximum_dynamic_range_db: 60.0
      minimum_range_m: 1.0
      maximum_range_m: 15.0
    clustering:
      range_gate_m: 0.5
      velocity_gate_m_s: 0.2
  evaluation:
    range_gate_m: 0.6
    velocity_gate_m_s: 0.25
  recording:
    profile: maps
    detection_stages: true
view_defaults:
  camera_view: isometric
  mpc_visibility:
    enabled: true
    paths: true
    bounce_points: true
  color_mode: path_loss
generator_summary:
  create: [topology, sensing]
  enabled: true
  sensing:
    figures: [range_profile, range_doppler, doppler, angles, detection]
    inspection_figures: [detection_stages]
