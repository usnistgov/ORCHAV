schema_version: 2
scene:
  source: local
  id: scene.xml
timeline:
  steps: 8
  sample_rate_hz: 1000.0
raytracing:
  enabled: true
  carrier_frequency_hz: 3500000000.0
  bandwidth_hz: 300000000.0
  antenna:
    tx:
      pattern: iso
      polarization: V
      num_rows: 1
      num_cols: 1
    rx:
      pattern: iso
      polarization: V
      num_rows: 1
      num_cols: 1
  quality:
    preset: low
    custom:
      max_depth: 1
      samples_per_src: 10000
      max_num_paths_per_src: 1000
      los: false
      specular_reflection: true
      diffuse_reflection: false
      refraction: false
      seed: 42
  cir_time_steps: 8
  cir_sampling_frequency_hz: 1000.0
actors:
  tx:
  - name: main_tx
    mobility:
      type: stationary
      position_m:
      - 0.0
      - 0.0
      - 1.5
  rx:
  - name: main_rx
    mobility:
      type: stationary
      position_m:
      - 0.0
      - 0.0
      - 1.5
data:
  mode: files
  files:
    directory: frames
    chunk_size: 8
generator_summary:
  enabled: false
sensing:
  enabled: true
  processing_mode: coherent_cpi
  range_mode: monostatic
  bandwidth: 300000000.0
  prf_hz: 1000.0
  fft_size_range: 128
  fft_size_doppler: 8
  window_range: boxcar
  window_doppler: boxcar
  range_response:
    model: cfr_ifft
    num_frequency_bins: 128
    frequency_window: boxcar
  raw_payload_policy: always
  noise_enabled: false
  clutter_removal_enabled: false
  output_range_doppler: true
  output_range_profile: true
  output_detections: true
  persist_detection_stage_artifacts: true
