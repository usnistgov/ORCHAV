<rect x="408" y="517" width="264" height="32" rx="7" fill="#e5f1fa"/>
<circle cx="420" cy="533" r="6" class="sample"/>
<circle cx="500" cy="533" r="6" class="sample"/>
<circle cx="580" cy="533" r="6" class="sample"/>
<circle cx="660" cy="533" r="6" class="sample"/>
<path d="M540.0 524l9 9l-9 9l-9-9z" class="reference"/>
