<text x="35" y="644" class="small" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="start">Subsequent windows advance by one sample. The first three samples are warm-up.</text>
<circle cx="55" cy="677" r="6" class="sample"/>
<text x="72" y="683" class="small" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="start">Sample</text>
<path d="M230 668l9 9l-9 9l-9-9z" class="reference"/>
<text x="247" y="683" class="small" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="start">Result reference time</text>
<rect x="503" y="670" width="14" height="14" class="ready"/>
<text x="527" y="683" class="small" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="start">Result available</text>
