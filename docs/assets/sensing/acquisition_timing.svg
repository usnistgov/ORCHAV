<circle cx="500" cy="416" r="6" class="sample"/>
<text x="500" y="446" class="small" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="middle">2</text>
<circle cx="580" cy="416" r="6" class="sample"/>
<text x="580" y="446" class="small" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="middle">3</text>
<circle cx="660" cy="416" r="6" class="sample"/>
<text x="660" y="446" class="small" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="middle">4</text>
<circle cx="740" cy="416" r="6" class="sample"/>
<text x="740" y="446" class="small" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="middle">5</text>
<circle cx="820" cy="416" r="6" class="sample"/>
<text x="820" y="446" class="small" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="middle">6</text>
<circle cx="900" cy="416" r="6" class="sample"/>
<text x="900" y="446" class="small" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="middle">7</text>
<text x="35" y="489" class="label" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start">Window 1</text>
