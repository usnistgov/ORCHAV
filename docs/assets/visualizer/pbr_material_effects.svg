<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="360" viewBox="0 0 1040 360" role="img" aria-labelledby="title desc">
  <title id="title">PBR material control comparison</title>
  <desc id="desc">Four material swatches compare roughness, metallic, clearcoat, and modern renderer transmission controls.</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7f9fb"/>
      <stop offset="1" stop-color="#e8edf3"/>
    </linearGradient>
    <radialGradient id="roughSphere" cx="35%" cy="25%" r="70%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#bbc4ca"/>
      <stop offset="1" stop-color="#66727b"/>
    </radialGradient>
    <radialGradient id="metalSphere" cx="31%" cy="22%" r="75%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.18" stop-color="#dfe6ed"/>
      <stop offset="0.48" stop-color="#7f8a95"/>
      <stop offset="0.72" stop-color="#f0f3f7"/>
      <stop offset="1" stop-color="#39444f"/>
    </radialGradient>
    <radialGradient id="clearSphere" cx="32%" cy="21%" r="72%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.16" stop-color="#f7fbff"/>
      <stop offset="0.32" stop-color="#97b4cc"/>
      <stop offset="0.68" stop-color="#4f6f85"/>
      <stop offset="1" stop-color="#273846"/>
    </radialGradient>
    <radialGradient id="glassSphere" cx="35%" cy="24%" r="72%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.22" stop-color="#e9f8ff" stop-opacity="0.75"/>
      <stop offset="0.58" stop-color="#8fcde7" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#24617c" stop-opacity="0.62"/>
    </radialGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#1f2933" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="1040" height="360" rx="18" fill="#ffffff"/>
  <rect x="24" y="24" width="992" height="312" rx="14" fill="url(#panel)" stroke="#c8d2dc"/>

  <g font-family="Inter, Arial, sans-serif" fill="#1f2933">
    <text x="52" y="66" font-size="24" font-weight="700">PBR material controls</text>
    <text x="52" y="94" font-size="15" fill="#50606f">The Materials panel edits visual appearance; Sionna RT electromagnetic material properties are separate.</text>
  </g>

  <g transform="translate(64 128)">
    <rect width="200" height="168" rx="10" fill="#ffffff" stroke="#d3dbe3"/>
    <ellipse cx="100" cy="122" rx="62" ry="13" fill="#3c4650" opacity="0.18"/>
    <circle cx="100" cy="78" r="54" fill="url(#roughSphere)" filter="url(#shadow)"/>
    <text x="100" y="148" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2933">High roughness</text>
    <text x="100" y="169" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#50606f">broad, soft highlight</text>
  </g>

  <g transform="translate(304 128)">
    <rect width="200" height="168" rx="10" fill="#ffffff" stroke="#d3dbe3"/>
    <ellipse cx="100" cy="122" rx="62" ry="13" fill="#3c4650" opacity="0.18"/>
    <circle cx="100" cy="78" r="54" fill="url(#metalSphere)" filter="url(#shadow)"/>
    <path d="M58 71 C88 40, 123 42, 145 70" fill="none" stroke="#f8fbff" stroke-width="8" opacity="0.88"/>
    <text x="100" y="148" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2933">Metallic</text>
    <text x="100" y="169" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#50606f">strong environment tint</text>
  </g>

  <g transform="translate(544 128)">
    <rect width="200" height="168" rx="10" fill="#ffffff" stroke="#d3dbe3"/>
    <ellipse cx="100" cy="122" rx="62" ry="13" fill="#3c4650" opacity="0.18"/>
    <circle cx="100" cy="78" r="54" fill="url(#clearSphere)" filter="url(#shadow)"/>
    <circle cx="82" cy="55" r="14" fill="#ffffff" opacity="0.88"/>
    <path d="M54 98 C89 118, 123 116, 151 95" fill="none" stroke="#e6f6ff" stroke-width="5" opacity="0.65"/>
    <text x="100" y="148" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2933">Clearcoat</text>
    <text x="100" y="169" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#50606f">extra glossy layer</text>
  </g>

  <g transform="translate(784 128)">
    <rect width="200" height="168" rx="10" fill="#ffffff" stroke="#d3dbe3"/>
    <rect x="32" y="38" width="136" height="92" rx="5" fill="#d6eaf8"/>
    <path d="M34 50 L166 118 M34 70 L166 138 M34 30 L166 98" stroke="#8aa9bd" stroke-width="6" opacity="0.45"/>
    <ellipse cx="100" cy="122" rx="62" ry="13" fill="#3c4650" opacity="0.18"/>
    <circle cx="100" cy="78" r="54" fill="url(#glassSphere)" stroke="#d8f4ff" stroke-width="2" filter="url(#shadow)"/>
    <path d="M69 53 C96 32, 124 39, 140 63" fill="none" stroke="#ffffff" stroke-width="7" opacity="0.78"/>
    <text x="100" y="148" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2933">Transmission</text>
    <text x="100" y="169" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#50606f">modern renderer glass</text>
  </g>
</svg>
